[package]
name = "dbm-server"
version = "0.1.0"
edition = "2024"

[dependencies]
age = "0.12.1"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chacha20poly1305 = "0.11.0"
dbm-shared = { version = "0.1.0", path = "../shared" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
mime_guess = "2.0.5"
rand = "0.10.4"
reqwest = { version = "0.13.5", features = ["form", "json"] }
rpassword = "7.5.5"
rust-embed = "8.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "uuid", "time"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v4", "serde"] }

[dev-dependencies]
dbm-shared = { path = "../shared" }
http-body-util = "0.1.5"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["net", "rt", "macros"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.29.3", features = ["v4"] }
