[package]
name = "dbm-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
dbm-shared = { version = "0.1.0", path = "../shared" }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
